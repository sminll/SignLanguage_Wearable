name: Data upload check

on:
  push:
    paths:
      - 'sensor-data/training/**/*.csv'
      - 'data/sensor_dataset_v*.csv'
      - 'datasets/**/*.csv'
      - 'datasets/**/*.zip'
  workflow_dispatch:
    inputs:
      dataset_path:
        description: '수동으로 다시 확인할 파일 (해당 측정자의 수집 현황 갱신)'
        required: false
        type: string
      bootstrap:
        description: '과거 기록을 기준점으로 등록 · 디스코드 전송 없음'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: data-digest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summarize and notify after uploads settle
        env:
          DATASET_PATH: ${{ inputs.dataset_path }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tools/data_notification_digest.py --report "$RUNNER_TEMP/data-report.json"
      - name: Keep inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-inspection
          path: ${{ runner.temp }}/data-report.json
          if-no-files-found: warn
          retention-days: 14
